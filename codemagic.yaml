workflows:
  spectrum-ai-android:
    name: SPECTRUM AI Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Generate Gradle wrapper
        script: gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        script: ./gradlew --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
